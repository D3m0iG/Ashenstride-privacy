name: Gerar cidades e monumentos
on:
  workflow_dispatch:
  push:
    paths:
      - 'passos-pelo-mundo/tools/build_places.py'
      - '.github/workflows/build-places.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python passos-pelo-mundo/tools/build_places.py
      - name: Guardar os dados no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add passos-pelo-mundo/data
          git diff --cached --quiet || git commit -m "Atualiza dados mundiais de cidades e monumentos"
          git push

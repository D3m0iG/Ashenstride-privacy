name: Gerar etapas a pé
on:
  workflow_dispatch:
    inputs:
      grupos:
        description: 'Grupos a calcular, separados por vírgula (iberia,franca,...,leste-grecia,ilhas-atlanticas,africa-norte,africa-oeste,africa-centro-leste,africa-sul,asia-medio-oriente-a,asia-medio-oriente-b) ou "todos"'
        default: 'todos'
      max_km:
        description: 'Distância máxima de cada etapa em km (150 por omissão; 300 para zonas esparsas como o Norte)'
        default: '150'
      fronteiras:
        description: 'Calcular no fim as ligações entre grupos (servidor de demonstração)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: etapas
env:
  TODOS: "MA DZ TN LY EG MR SN GM GW GN SL LR CI GH TG BJ NG BF ML NE CV CM TD CF GA GQ CG CD AO SD SS ET ER DJ SO KE UG RW BI TZ ZM MW MZ ZW BW NA ZA LS SZ MG MU KM SC PT ES AD FR MC BE NL LU CH LI AT DE IT SI HR BA RS ME AL MK XK MT GB IE PL CZ SK HU RO BG DK SE NO FI EE LV LT UA BY MD GR CY TR GE AM AZ IL PS LB SY JO IQ IR SA AE QA BH KW OM YE"
jobs:
  grupo:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - { nome: iberia,           paises: "PT ES AD",                          regioes: "europe/portugal europe/spain europe/andorra" }
          - { nome: franca,           paises: "FR MC",                             regioes: "europe/france europe/monaco" }
          - { nome: benelux-alpes,    paises: "BE NL LU CH LI AT",                 regioes: "europe/belgium europe/netherlands europe/luxembourg europe/switzerland europe/liechtenstein europe/austria" }
          - { nome: alemanha,         paises: "DE",                                regioes: "europe/germany" }
          - { nome: italia-balcas,    paises: "IT SI HR BA RS ME AL MK XK MT",     regioes: "europe/italy europe/slovenia europe/croatia europe/bosnia-herzegovina europe/serbia europe/montenegro europe/albania europe/macedonia europe/kosovo europe/malta" }
          - { nome: uk-irlanda,       paises: "GB IE",                             regioes: "europe/great-britain europe/ireland-and-northern-ireland" }
          - { nome: centro-leste,     paises: "PL CZ SK HU RO BG",                 regioes: "europe/poland europe/czech-republic europe/slovakia europe/hungary europe/romania europe/bulgaria" }
          - { nome: nordicos-balticos, paises: "DK SE NO FI EE LV LT",             regioes: "europe/denmark europe/sweden europe/norway europe/finland europe/estonia europe/latvia europe/lithuania" }
          - { nome: leste-grecia,     paises: "UA BY MD GR CY",                    regioes: "europe/ukraine europe/belarus europe/moldova europe/greece europe/cyprus" }
          - { nome: ilhas-atlanticas, paises: "PT ES",                         regioes: "europe/azores africa/canary-islands" }
          - { nome: africa-norte,     paises: "MA DZ TN LY EG MR",                regioes: "africa/morocco africa/algeria africa/tunisia africa/libya africa/egypt africa/mauritania" }
          - { nome: africa-oeste,     paises: "SN GM GW GN SL LR CI GH TG BJ NG BF ML NE CV", regioes: "africa/senegal-and-gambia africa/guinea-bissau africa/guinea africa/sierra-leone africa/liberia africa/ivory-coast africa/ghana africa/togo africa/benin africa/nigeria africa/burkina-faso africa/mali africa/niger africa/cape-verde" }
          - { nome: africa-centro-leste, paises: "CM TD CF GA GQ CG CD AO SD SS ET ER DJ SO KE UG RW BI TZ", regioes: "africa/cameroon africa/chad africa/central-african-republic africa/gabon africa/equatorial-guinea africa/congo-brazzaville africa/congo-democratic-republic africa/angola africa/sudan africa/south-sudan africa/ethiopia africa/eritrea africa/djibouti africa/somalia africa/kenya africa/uganda africa/rwanda africa/burundi africa/tanzania" }
          - { nome: africa-sul,       paises: "ZM MW MZ ZW BW NA ZA LS SZ MG MU KM SC", regioes: "africa/zambia africa/malawi africa/mozambique africa/zimbabwe africa/botswana africa/namibia africa/south-africa-and-lesotho africa/swaziland africa/madagascar africa/mauritius africa/comores africa/seychelles" }
          - { nome: asia-medio-oriente-a, paises: "TR GE AM AZ IL PS LB SY JO", regioes: "europe/turkey europe/georgia asia/armenia asia/azerbaijan asia/israel-and-palestine asia/lebanon asia/syria asia/jordan" }
          - { nome: asia-medio-oriente-b, paises: "IQ IR SA AE QA BH KW OM YE", regioes: "asia/iraq asia/iran asia/gcc-states asia/yemen" }
    steps:
      - name: Decidir se este grupo corre
        id: dec
        run: |
          G="${{ inputs.grupos }}"
          if [ "$G" = "todos" ] || echo ",$G," | grep -q ",${{ matrix.nome }},"; then echo run=1 >> $GITHUB_OUTPUT; else echo run=0 >> $GITHUB_OUTPUT; fi
      - if: steps.dec.outputs.run == '1'
        uses: actions/checkout@v4
        with: { ref: main }
      - if: steps.dec.outputs.run == '1'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: steps.dec.outputs.run == '1'
        run: pip install numpy scipy
      - name: Libertar espaço em disco
        if: steps.dec.outputs.run == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1; free -g | sed -n 2p; nproc
      - name: Descarregar OpenStreetMap (Geofabrik)
        if: steps.dec.outputs.run == '1'
        run: |
          mkdir -p vh
          for r in ${{ matrix.regioes }}; do curl -fL --retry 6 --retry-delay 15 --retry-all-errors -sS -o vh/$(basename $r).osm.pbf https://download.geofabrik.de/$r-latest.osm.pbf; done
          ls -la vh; chmod -R 777 vh; df -h / | tail -1
      - name: Construir o grafo do Valhalla
        if: steps.dec.outputs.run == '1'
        run: |
          IMG=ghcr.io/valhalla/valhalla:latest
          docker run --rm -u root -v $PWD/vh:/data $IMG bash -c "valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-concurrency 4 --service-limits-pedestrian-max-distance 400000 > /data/valhalla.json && valhalla_build_tiles -c /data/valhalla.json /data/*.osm.pbf" > build.log 2>&1 || (tail -60 build.log; exit 1)
          tail -3 build.log; du -sh vh/tiles; rm -f vh/*.osm.pbf; df -h / | tail -1
      - name: Arrancar o Valhalla
        if: steps.dec.outputs.run == '1'
        run: |
          docker run -d --name vh -u root -p 8002:8002 -v $PWD/vh:/data ghcr.io/valhalla/valhalla:latest valhalla_service /data/valhalla.json 4
          for i in $(seq 1 90); do curl -fs localhost:8002/status && break; sleep 2; done; echo
          curl -fs localhost:8002/status > /dev/null || (docker logs vh | tail -40; exit 1)
      - name: Calcular etapas do grupo
        if: steps.dec.outputs.run == '1'
        env:
          PAISES: ${{ matrix.paises }}
          MODO: local
          MAX_KM: ${{ inputs.max_km }}
        run: python passos-pelo-mundo/tools/build_stages.py
      - name: Guardar no repositório
        if: steps.dec.outputs.run == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add passos-pelo-mundo/data/etapas
          git diff --cached --quiet || git commit -m "Etapas a pé: grupo ${{ matrix.nome }}"
          git pull --rebase -q origin main
          git push

  fronteiras:
    needs: grupo
    if: always() && inputs.fronteiras
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy
      - name: Calcular ligações entre grupos (servidor de demonstração)
        env:
          PAISES: ""
          MODO: demo
          MAX_KM: ${{ inputs.max_km }}
        run: python passos-pelo-mundo/tools/build_stages.py
      - name: Guardar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add passos-pelo-mundo/data/etapas
          git diff --cached --quiet || git commit -m "Etapas a pé: fronteiras entre grupos"
          git pull --rebase -q origin main
          git push

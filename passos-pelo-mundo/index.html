<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17233F">
<title>Passos pelo Mundo, protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --ink:#17233F; --ink-2:#24355E; --paper:#F2F5F1; --rule:rgba(23,35,63,.16);
  --muted:#586581; --trail:#F2B705; --route:#2F6FED; --stamp:#C2274B; --moss:#237A57;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'B612 Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{height:100vh;height:100dvh}
button,select,input,a{touch-action:manipulation}
body{display:flex;flex-direction:column;font-family:var(--display);color:var(--ink);background:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--trail);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#cfd8e3}
#map{position:absolute;inset:0}
#mapmsg{position:absolute;inset:0;display:grid;place-items:center;padding:150px 28px 40px;text-align:center;color:var(--ink);font-size:16px;line-height:1.45}
#mapmsg[hidden]{display:none}
#fog{position:absolute;left:0;top:0;pointer-events:none}

/* HUD: a linha da viagem */
#hud{position:absolute;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;max-width:470px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 9px;box-shadow:0 6px 20px rgba(10,18,40,.35)}
.hud-ends{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;font-size:17px;line-height:1.15}
.hud-ends span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-ends .to{text-align:right}
.track{position:relative;height:18px;margin:5px 8px 3px}
.track::before{content:'';position:absolute;left:0;right:0;top:8px;border-top:2px dashed rgba(255,255,255,.34)}
.track .fill{position:absolute;left:0;top:7px;height:4px;width:0;border-radius:2px;background:var(--trail)}
.track .dot{position:absolute;top:1px;left:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--trail);border:3px solid #fff}
.hud-nums{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,255,255,.84);font-variant-numeric:tabular-nums}
.hud-foot{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13.5px;font-variant-numeric:tabular-nums}
.hud-foot .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-foot .chip{font-family:var(--mono);font-size:12px;background:var(--ink-2);border-radius:8px;padding:5px 8px;white-space:nowrap}
.hud-foot button{border:0;background:var(--ink-2);color:#fff;border-radius:9px;width:36px;height:32px;display:grid;place-items:center;padding:0}
.hud-foot button svg.ic{width:19px;height:19px}

.mapbtns{position:absolute;z-index:4;right:10px;bottom:112px;display:flex;flex-direction:column;gap:8px}
.mapbtns button{width:42px;height:42px;border-radius:12px;border:0;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(10,18,40,.3);display:grid;place-items:center;padding:0}
.mapbtns button[aria-pressed=true]{background:var(--ink);color:var(--trail)}

#toasts{position:absolute;z-index:9;left:0;right:0;bottom:40px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:#fff;border-radius:999px;padding:8px 15px;font-size:14px;box-shadow:0 4px 14px rgba(10,18,40,.35);max-width:100%;text-align:center}
.toast b{color:var(--trail);font-weight:700}

/* Doca dos passos */
#dock{flex:none;background:var(--ink);color:#fff;padding:8px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:6px;max-width:560px;margin:0 auto}
.steps button{border:0;border-radius:12px;background:var(--ink-2);color:#fff;padding:8px 4px 7px;line-height:1.1;min-height:50px}
.steps button b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.steps button small{font-size:12px;color:rgba(255,255,255,.72)}
.steps .auto{background:var(--trail);color:var(--ink)}
.steps .auto small{color:rgba(23,35,63,.78)}
.steps .auto[aria-pressed=true]{background:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:6px auto 0}
.tabs button{position:relative;border:0;background:none;color:rgba(255,255,255,.66);padding:6px 2px 4px;font-size:12.5px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-selected=true]{color:#fff}
.tabs button[aria-selected=true] svg.ic{color:var(--trail)}
.tabs .badge{position:absolute;top:3px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--stamp);border:2px solid var(--ink)}
.tabs .badge[hidden]{display:none}

/* Folhas */
.sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;max-height:84%;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(10,18,40,.3);transform:translateY(104%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 8px 16px}
.sheet-head h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em}
.sheet-head button{border:0;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.sheet-body{overflow:auto;padding:4px 16px 22px;-webkit-overflow-scrolling:touch}
.sheet-body.guilloche{background-image:repeating-radial-gradient(circle at 18% 8%,rgba(35,122,87,.07) 0 1px,transparent 1px 9px)}
@media (min-width:900px){
  .sheet{left:auto;top:12px;right:12px;bottom:12px;width:410px;max-height:none;border-radius:18px;transform:translateX(112%)}
}

.lead{font-size:14px;color:var(--muted);line-height:1.45;margin:0 0 12px}
.passport-top{background:var(--ink);color:#fff;border-radius:14px;padding:14px 14px 12px;margin-bottom:16px;overflow:hidden}
.passport-top .big{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.passport-top .sub{font-size:14px;color:rgba(255,255,255,.82);margin-top:4px}
.mrz{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.66);margin-top:12px;white-space:nowrap;overflow:hidden}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 10px}
.slot{aspect-ratio:1.18;border:1.5px dashed var(--rule);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:12px;line-height:1.2;color:var(--muted)}
.stamp{--inkc:var(--stamp);aspect-ratio:1.18;border:2.5px solid var(--inkc);border-radius:12px;outline:1.5px solid var(--inkc);outline-offset:-7px;color:var(--inkc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:9px;text-align:center;transform:rotate(var(--rot,-4deg));font-family:var(--mono);text-transform:uppercase;line-height:1.15;background:rgba(255,255,255,.42)}
.stamp .code{font-size:22px;font-weight:700;letter-spacing:.05em}
.stamp .nm{font-size:10px;font-weight:700;overflow-wrap:anywhere}
.stamp .dt{font-size:9.5px}

.coll h3{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700;margin:18px 0 8px}
.coll h3:first-child{margin-top:4px}
.coll h3 span{font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.items li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:15px}
.items li.locked{color:var(--muted)}
.items li time,.items li .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}

.field{display:block;margin:14px 0}
.field>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.field output{float:right;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
select,input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;font-size:16px}
input[type=range]{width:100%;accent-color:var(--ink)}
.fixed{padding:11px 12px;border-radius:10px;border:1.5px solid var(--rule);background:rgba(255,255,255,.5);font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:16px;background:var(--ink);color:#fff;margin-top:10px}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--rule)}
.btn.go{background:var(--trail);color:var(--ink)}
.btn.danger{background:var(--stamp)}
.btn[disabled]{opacity:.55;cursor:default}
.note{font-size:13.5px;color:var(--muted);line-height:1.45;margin:8px 0}
.note.warn{color:#7a4300}
.sum{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;margin:12px 0 4px}
.sum strong{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sum span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.credits{font-size:13.5px;line-height:1.5;color:var(--ink);padding-left:18px;margin:6px 0}
.credits a{color:var(--route)}

.modal{position:absolute;z-index:12;inset:0;background:rgba(15,22,44,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal[hidden]{display:none}
.card{width:100%;max-width:440px;max-height:94%;overflow:auto;background:var(--paper);border-radius:18px;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(10,18,40,.45)}
.card h2{margin:0 0 6px;font-size:25px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
@media (min-width:700px){.modal{align-items:center}}

.mk-player{width:26px;height:26px;border-radius:50%;background:var(--trail);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.mk-dest{width:18px;height:18px;border-radius:4px;background:var(--stamp);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transform:rotate(45deg)}
.mk-poi{font-family:var(--display);font-size:11.5px;font-weight:700;background:#fff;color:var(--ink);border-radius:9px;padding:2px 7px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap}
.mk-poi.locked{background:var(--ink);color:#fff;width:20px;height:20px;padding:0;border-radius:50%;text-align:center;line-height:20px}
#map.far .mk-poi,#map.far .mk-poi.locked{font-size:0;line-height:0;width:9px;height:9px;padding:0;border-radius:50%;background:var(--ink);border:2px solid #fff}
#map.far .mk-poi:not(.locked){background:var(--trail)}
#map.mid .mk-poi:not(.locked){width:12px;height:12px;padding:0;border-radius:50%;background:var(--trail);border:2px solid #fff;font-size:0;line-height:0}

#stampfx{position:absolute;z-index:11;inset:0;display:grid;place-items:center;pointer-events:none}
#stampfx[hidden]{display:none}
#stampfx .stamp{width:210px;background:rgba(242,245,241,.94);box-shadow:0 12px 40px rgba(10,18,40,.35);animation:thunk 2.6s ease forwards}
#stampfx .stamp .code{font-size:44px}
#stampfx .stamp .nm{font-size:14px}
#stampfx .stamp .dt{font-size:12px}
@keyframes thunk{0%{transform:scale(2.3) rotate(-15deg);opacity:0}10%{transform:scale(1) rotate(-7deg);opacity:1}82%{transform:scale(1) rotate(-7deg);opacity:1}100%{transform:scale(.92) rotate(-7deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet.open{transition:none}
  #stampfx .stamp{animation:fadeonly 2.6s linear forwards}
  @keyframes fadeonly{0%,85%{opacity:1}100%{opacity:0}}
}
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="mapmsg" hidden></div>

  <header id="hud">
    <div class="hud-ends"><span class="from" id="hudFrom"></span><span class="to" id="hudTo"></span></div>
    <div class="track" id="hudTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="hudFill"></div><div class="dot" id="hudDot"></div></div>
    <div class="hud-nums"><span id="hudL"></span><span id="hudR"></span></div>
    <div class="hud-foot">
      <span class="msg" id="hudMsg"></span>
      <span class="chip" id="hudChip"></span>
      <button type="button" id="btnPlan"><svg class="ic" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg></button>
      <button type="button" id="btnSettings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </header>

  <div class="mapbtns">
    <button type="button" id="btnWorld"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
    <button type="button" id="btnFollow" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button type="button" id="btnFog" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1 .6-7.96A5.5 5.5 0 0 1 18.2 9 3.2 3.2 0 0 1 17.5 15z"/><path d="M5 19h10M9 22h10"/></svg></button>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" id="sheetClose"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div id="modal" class="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
  <div id="stampfx" hidden></div>
</div>

<footer id="dock">
  <div class="steps">
    <button type="button" data-add="100"><b>+100</b><small data-t="steps"></small></button>
    <button type="button" data-add="1000"><b id="lbl1k"></b><small data-t="steps"></small></button>
    <button type="button" data-add="10000"><b id="lbl10k"></b><small data-t="steps"></small></button>
    <button type="button" class="auto" id="btnAuto" aria-pressed="false"><b id="autoLbl"></b><small id="autoSub"></small></button>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="map" aria-selected="true"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="tabMap"></span></button>
    <button type="button" role="tab" data-tab="passport" aria-selected="false"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 17h6"/></svg><span data-t="tabPassport"></span><i class="badge" id="badgePassport" hidden></i></button>
    <button type="button" role="tab" data-tab="collections" aria-selected="false"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6L3.4 9.3l6-.7z"/></svg><span data-t="tabCollections"></span><i class="badge" id="badgeCollections" hidden></i></button>
    <button type="button" role="tab" data-tab="diary" aria-selected="false"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2z"/><path d="M10 8h5M10 12h5M10 16h3"/></svg><span data-t="tabDiary"></span></button>
  </nav>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   1. CONFIGURAÇÃO
   Tudo o que depende de serviços externos está aqui, para trocar depressa.
   ===================================================================== */
var CFG = {
  styleUrl: 'https://tiles.openfreemap.org/styles/liberty',        // tiles OSM (OpenFreeMap)

  routeTimeoutMs: 25000

var CITIES = [

  { id:'elvas',    pt:'Elvas',    cc:'PT', p:[-7.1628,38.8810], next:'badajoz' },

  { id:'merida',   pt:'Mérida',   cc:'ES', p:[-6.3437,38.9161], next:'badajoz' },
  { id:'faro',     pt:'Faro',     cc:'PT', p:[-7.9350,37.0161], next:'evora' }
];
var POIS = [
  { id:'c-lisboa',   kind:'city', capital:true, pt:'Lisboa', en:'Lisbon', cc:'PT', p:[-9.1399,38.7169] },
  { id:'c-alverca',  kind:'city', pt:'Alverca do Ribatejo', cc:'PT', p:[-9.0386,38.8958] },
  { id:'c-vfx',      kind:'city', pt:'Vila Franca de Xira', cc:'PT', p:[-8.9897,38.9553] },
  { id:'c-azambuja', kind:'city', pt:'Azambuja', cc:'PT', p:[-8.8669,39.0697] },
  { id:'c-cartaxo',  kind:'city', pt:'Cartaxo', cc:'PT', p:[-8.7878,39.1608] },
  { id:'c-santarem', kind:'city', pt:'Santarém', cc:'PT', p:[-8.6850,39.2362] },
  { id:'c-tomar',    kind:'city', pt:'Tomar', cc:'PT', p:[-8.4150,39.6036] },
  { id:'c-coimbra',  kind:'city', pt:'Coimbra', cc:'PT', p:[-8.4290,40.2089] },
  { id:'c-porto',    kind:'city', pt:'Porto', cc:'PT', p:[-8.6110,41.1496] },

  h += '<button type="button" class="btn ' + (resetArmed ? 'danger' : 'alt') + '" id="btnReset">' + esc(t(resetArmed ? 'resetConfirm' : 'reset')) + '</button>';
  return h;
}
function bindSettings() {
  var s = S.settings;
  el('inStride').oninput = function () { s.stride = Number(this.value); el('oStride').textContent = dec(s.stride, 2) + ' m'; el('scaleHint').textContent = t('scaleHint', { m: dec(mps(), 2) }); saveSoon(); renderHud(); };
  el('inScale').onchange = function () { s.scale = Number(this.value); el('scaleHint').textContent = t('scaleHint', { m: dec(mps(), 2) }); saveSoon(); renderHud(); };
  el('inSpeed').onchange = function () { s.autoSpeed = this.value; saveSoon(); };
  el('inEngine').onchange = function () { s.engine = this.value; el('ghField').hidden = s.engine !== 'graphhopper'; saveSoon(); };
  el('inKey').oninput = function () { s.ghKey = this.value; saveSoon(); };
  el('inLang').onchange = function () { S.lang = this.value; saveNow(); renderAll(); };
  el('btnReset').onclick = function () {
    if (!resetArmed) { resetArmed = true; renderSheet(); return; }
    stopAuto(); try { localStorage.removeItem(CFG.saveKey); localStorage.removeItem(CFG.saveKey + ':route'); } catch (e) {}
    var lang = S.lang; S = freshState(); S.lang = lang; ROUTE = null; walkedFog = []; curFeat = null; resetArmed = false;
    syncCountryLayer(); syncTrails(); showTab('map'); renderAll(true); toast(t('resetDone')); openPlanner();
  };
}

/* ---- Janela de viagem ---- */
var plan = null;
function openPlanner(toPoi) {
  stopAuto();
  var fromId = S.pos ? S.pos.cityId : 'lisboa', fc = fromId && placeById(fromId);
  plan = { fromId: fromId, toId: (fc && fc.next) || (fromId === 'santarem' ? 'tomar' : 'santarem'), status: 'idle', err: null, route: null };
  if (plan.toId === plan.fromId) plan.toId = CITIES[0].id === plan.fromId ? CITIES[1].id : CITIES[0].id;
  if (toPoi) { plan.toId = toPoi; plan.toPicked = true; }
  renderPlanner(); el('modal').hidden = false; if (toPoi) calcRoute();
}
function closeModal() { el('modal').hidden = true; el('card').innerHTML = ''; plan = null; }
function originPoint() { if (S.pos) return S.pos.pt; return cityById(plan.fromId).p; }
function renderPlanner() {
  if (!plan) return;
  var h = '<h2>' + esc(t('planTitle')) + '</h2>';
  h += '<p class="note">' + esc(S.trip ? t('planChange') : t('planIntro')) + '</p>';
  if (!S.pos) h += '<label class="field"><span>' + esc(t('from')) + '</span><select id="plFrom">' + CITIES.map(function (c) { return '<option value="' + c.id + '"' + (c.id === plan.fromId ? ' selected' : '') + '>' + esc(placeName(c)) + ', ' + esc(countryName(c.cc)) + '</option>'; }).join('') + '</select></label>';
  else h += '<div class="field"><span>' + esc(t('from')) + '</span><div class="fixed">' + esc(posLabel()) + '</div></div>';
  var toList = CITIES.filter(function (c) { return c.id !== plan.fromId; }), extra = cityById(plan.toId) ? null : placeById(plan.toId); if (extra) toList = [extra].concat(toList);
  h += '<label class="field"><span>' + esc(t('to')) + '</span><select id="plTo">' + toList.map(function (c) { return '<option value="' + c.id + '"' + (c.id === plan.toId ? ' selected' : '') + '>' + esc(placeName(c)) + ', ' + esc(countryName(c.cc)) + '</option>'; }).join('') + '</select></label>';
  if (plan.status === 'loading') h += '<p class="note">' + esc(t('calculating')) + '</p>';
  if (plan.status === 'error') h += '<p class="note warn">' + esc(t(plan.err)) + '</p>';
  if (plan.status === 'ready') {
    var r = buildRoute(plan.route.coords), steps = Math.ceil(r.total / mps());
    h += '<div class="sum"><strong>' + esc(t('sumKm', { km: km(r.total) })) + '</strong><span>' + esc(t('sumSteps', { n: nf(steps), m: dec(mps(), 2) })) + '</span><span>' + esc(t('sumDays', { d: nf(Math.max(1, Math.ceil(steps / 8000))) })) + '</span></div>';
    h += '<p class="note' + (plan.route.source === 'offline' ? ' warn' : '') + '">' + esc(t(plan.route.source === 'etapas' ? 'srcEtapas' : plan.route.source === 'valhalla' ? 'srcValhalla' : plan.route.source === 'graphhopper' ? 'srcGraphhopper' : 'srcOffline')) + '</p>';
    h += '<button type="button" class="btn go" id="plStart">' + esc(t('start')) + '</button>';
    if (plan.route.sea) h += '<p class="note">' + esc(t('seaNote', { n: plan.route.sea })) + '</p>';
    if (plan.route.source === 'offline') h += '<button type="button" class="btn alt" id="plCalc">' + esc(t('retry')) + '</button>';
  } else {
    h += '<button type="button" class="btn" id="plCalc"' + (plan.status === 'loading' ? ' disabled' : '') + '>' + esc(t('calc')) + '</button>';
  }
  if (S.pos) h += '<button type="button" class="btn alt" id="plCancel">' + esc(t('cancel')) + '</button>';
  el('card').innerHTML = h;
  var pf = el('plFrom'), pt = el('plTo'), pc = el('plCalc'), ps = el('plStart'), px = el('plCancel');
  if (pf) pf.onchange = function () { plan.fromId = this.value; var c = cityById(plan.fromId); if (!plan.toPicked || plan.toId === plan.fromId) plan.toId = c.next; plan.status = 'idle'; plan.route = null; renderPlanner(); };
  if (pt) pt.onchange = function () { plan.toId = this.value; plan.toPicked = true; plan.status = 'idle'; plan.route = null; renderPlanner(); };
  if (pc) pc.onclick = calcRoute;
  if (ps) ps.onclick = function () { var p = plan; closeModal(); if (!startTrip(p)) toast(t('errFailed')); };
  if (px) px.onclick = closeModal;
}
function calcRoute() {
  if (!plan || plan.status === 'loading') return;
  var mine = plan, a = originPoint(), b = placeById(plan.toId).p;
  plan.status = 'loading'; plan.err = null; renderPlanner();
  planRoute(a, b).then(function (r) {
    if (plan !== mine) return; plan.route = r; plan.status = 'ready'; renderPlanner();
  }, function (e) {
    if (plan !== mine) return;
    var off = (S.pos ? S.pos.cityId : plan.fromId) ? offlineRoute(S.pos ? S.pos.cityId : plan.fromId, plan.toId) : null;
    if (e && e.code === 'too_far') { plan.status = 'error'; plan.err = 'errTooFar'; }
    else if (e && e.code === 'nokey') { plan.status = 'error'; plan.err = 'errKey'; }
    else if (off) { plan.route = off; plan.status = 'ready'; }
    else { plan.status = 'error'; plan.err = 'errFailed'; }
    renderPlanner();
  });
}
function openPoi(q) {
  var found = (q.kind === 'city' ? S.cities : S.monuments)[q.id];
  var here = S.pos ? S.pos.pt : null, d = here ? hav(here, q.p) : null, hereAlready = d !== null && d < 150;
  var kind = q.kind === 'city' ? (q.capital ? t('kCapital') : t('kCity')) : t('kMonument');
  var h = '<h2>' + esc(found ? placeName(q) : t('undiscovered')) + '</h2>';
  h += '<p class="note">' + esc(kind + (q.cc ? ' · ' + countryName(q.cc) : '')) + (d !== null && !hereAlready ? ' · ' + esc(t('straight', { km: km(d) })) : '') + '</p>';
  if (!found) h += '<p class="note">' + esc(t('poiHint')) + '</p>';
  if (hereAlready) h += '<p class="note">' + esc(t('alreadyHere')) + '</p>';
  else h += '<button type="button" class="btn go" id="poiGo">' + esc(t('goThere')) + '</button>';
  h += '<button type="button" class="btn alt" id="poiClose">' + esc(t('close')) + '</button>';
  el('card').innerHTML = h; el('modal').hidden = false; plan = null;
  var go = el('poiGo'); if (go) go.onclick = function () { openPlanner(q.id); };
  el('poiClose').onclick = closeModal;
}
function showArrival(info) {
  var h = '<h2>' + esc(t('arriveTitle', { city: info.city })) + '</h2><p class="note">' + esc(t('arriveBody', { km: info.kmTxt, n: info.steps })) + '</p>';
  h += '<button type="button" class="btn go" id="arNext">' + esc(t('arriveNext')) + '</button><button type="button" class="btn alt" id="arStay">' + esc(t('arriveStay')) + '</button>';
  el('card').innerHTML = h; el('modal').hidden = false;
  el('arNext').onclick = function () { openPlanner(); };
  el('arStay').onclick = closeModal;
}

/* ---- Caminhada automática (simulação de passos) ---- */
var autoTimer = null, autoAcc = 0;
function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } renderAuto(); }
function toggleAuto() {
  if (autoTimer) { stopAuto(); return; }
  if (!S.trip) { openPlanner(); return; }
  autoAcc = 0;
  autoTimer = setInterval(function () {
    autoAcc += (SPEEDS[S.settings.autoSpeed] || 200) / 10;
    var n = Math.floor(autoAcc); if (n > 0) { autoAcc -= n; addSteps(n); }
  }, 100);
  renderAuto();
}

/* =====================================================================
   12. ARRANQUE
   ===================================================================== */
function boot() {
  S = loadState(); indexPois();
  if (S.trip) { ROUTE = loadRoute(); if (!ROUTE) S.trip = null; else { S.trip.totalM = ROUTE.total; S.trip.doneM = Math.min(S.trip.doneM, ROUTE.total); walkedFog = decimate(sliceRoute(ROUTE, 0, S.trip.doneM), 120); } }
  var adds = document.querySelectorAll('[data-add]');
  for (var i = 0; i < adds.length; i++) adds[i].onclick = function () { addSteps(Number(this.getAttribute('data-add'))); };
  var tabs = document.querySelectorAll('.tabs button');
  for (var j = 0; j < tabs.length; j++) tabs[j].onclick = function () { var tb = this.getAttribute('data-tab'); showTab(openTab === tb && tb !== 'map' ? 'map' : tb); };
  el('btnAuto').onclick = toggleAuto;
  el('sheetClose').onclick = function () { showTab('map'); };
  el('btnPlan').onclick = function () { openPlanner(); };
  el('btnSettings').onclick = function () { showTab(openTab === 'settings' ? 'map' : 'settings'); };
  el('btnWorld').onclick = function () { setFollow(false); if (mapReady) map.flyTo({ center: [S.pos ? S.pos.pt[0] : 0, 25], zoom: 1.4, duration: 1200 }); };
  el('btnFollow').onclick = function () { setFollow(!follow); };
  el('btnFog').onclick = function () { S.settings.fog = !S.settings.fog; this.setAttribute('aria-pressed', S.settings.fog ? 'true' : 'false'); saveSoon(); drawFog(); };
  el('modal').addEventListener('click', function (e) { if (e.target === this && S.pos) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!el('modal').hidden && S.pos) closeModal(); else if (openTab !== 'map') showTab('map'); } });
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);
  renderAll();
  initMap();
  loadCountries();
  loadWorld();
  loadStages();
  if (!S.pos) openPlanner();
}
window.__passos = { state: function () { return S; }, route: function () { return ROUTE; }, addSteps: addSteps,
  geo: { hav: hav, decodePolyline: decodePolyline, buildRoute: buildRoute, locate: locate, sliceRoute: sliceRoute, decimate: decimate, geomContains: geomContains },
  iso: A2, n3: N3_TO_A2, offline: OFFLINE_LIS_STR, cities: CITIES, pois: POIS, cfg: CFG, addWorld: addWorld, nearPois: nearPois, addStages: addStages, seaCross: seaCross, openPlanner: openPlanner, stages: function () { return STG; }, planRoute: planRoute };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
